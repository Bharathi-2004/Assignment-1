<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Registration</title>
</head>
<body>
    <center>
    <table>
        <tr>
            <th colspan="2 span">Personal Information</th>
        </tr>
        <tr>
            <td>
                <label for="name">Name</label>
            </td>
            <td><input id="name" type="text" placeholder="Enter your name"></td>
        </tr>
        <tr>
            <td>
                <label for="email">Email</label>
            </td>
            <td><input id="email" type="email" placeholder="Enter your Email"></td>
        </tr>
        <tr>
            <td>
                <label for="ph">Phone</label>
            </td>
            <td><input id="ph" type="tel" maxlength="10" placeholder="Enter your Num"></td>
        </tr>
         <tr>
            <td>
                <label for="dob">DOB</label>
            </td>
            <td><input id="dob" type="date" value="2026-10-05" style="width: 96%;"></td>
        </tr>
        <tr>
            <td>
                <lable>Gender</lable>
            </td>
            <td>
                <input type="radio" name="gender" value="male">Male
                <input type="radio" name="gender" value="female">Female
                <input type="radio" name="gender" value="other">Other
            </td>
        </tr>
        <tr>
            <td>
               <label>Resume</label> 
            </td>
            <td>
                <input type="file" accept=".pdf">
            </td>
        </tr>
        <tr>
            <td>
                <label for="domain">Domain</label>
            </td>
            <td>
                <select id="Domain" style="width: 80%;">
                    <optgroup label="IT">
                        <option value="Developer">Developer</option>
                        <option value="Testing">Testing</option>
                        <option value="Networking">Networking</option>

                    </optgroup>
                    <optgroup label="Non IT">
                        <option value="junior assistant">junior assistant</option>
                        <option value="Team Leader">Team Leader</option>

                    </optgroup>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label for="git">Github</label>
            </td>
            <td>
                <input id="git" type="url" placeholder=" enter github url...">
            </td>
        </tr>
        <tr>
            <td>
                <label>Colour</label>
            </td>
            <td>
                <input type="color" value="blue" style="width: 80%;">
                
            </td>
        </tr>
        <tr>
            <td>
                <label for="bio">
                    Shot Bio                
                </label>
            </td>
            <td>
                <textarea id="bio" placeholder="Tell as about yourself... " cols="30" rows="5"></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <button type="submit" accesskey="s">submit</button> 
            </td>
            <td>
                <button type="reset">Reset</button> 
            </td>
        </tr>
    </table>
    </center>
    
</body>
</html>
