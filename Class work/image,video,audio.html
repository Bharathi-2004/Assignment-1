<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Video Audio</title>
</head>
<body>
    <a href="https://www.w3schools.com/Html/" target="_blank">
    <img alt="Fruit Image" src="supermarket/img/fruit.jpg" title="Fruit Image" width="350">
    </a>
    <video controls width="400" height="250" autoplay muted loop>
        <source src="video/video.mp4" type="video/mp4">
    </video>
    <audio controls muted>
        <source src="audio/audio.mpeg" type="audio/mpeg">
    </audio>
</body>
</html>
