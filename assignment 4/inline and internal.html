<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three section</title>
    <link rel="stylesheet" href="external.css">
    <style>
        .internal{
            text-align: center;
            background-color: aquamarine;
            color: crimson;
            border: 3px dashed purple;
            margin: 20px 2px 2px 2px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Three type of css</h1>
        
    </header>
    <main>
    <!-- Inline CSS -->
     <section style="background-color: chartreuse; border: 2px solid green; text-align: center; text-shadow: 2px 2px 2px blueviolet;">
        <h2>Inline css</h2>
        <p>This style using to inline css...</p>
    </section>
    <!-- Internal CSS -->
    <section class="internal">
        <h2>Internal Css</h2>
        <p>This style using to Internal css...</p>


    </section>
    <!-- External CSS -->
    <section id="external">
        <h2>External Css</h2>
        <p>This style using to external css...</p>


    </section>
    </main>
</body>
</html>
