<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
       
        
        .box{
            text-align: center;
            border: 2px solid green;
            padding: 10px 10px 10px 10px;
            border-radius: 20px;
            background-color: rgb(239, 253, 253);
            
        }
        div>img{
            border: 2px solid rgb(49, 6, 243);
            background-color: lime;
           
        }
        b,p,span{
            color: rgb(0, 79, 116);
        }
        div>button{
            color: rgb(250, 247, 246);
            border-radius: 22px;
            background-color: blueviolet;
        }
        
       
        

    </style>
</head>
<body>
    <header style="text-align: center;">
        <h1>Group and Child Selector</h1>
    </header>
    <main>
        <section class="box">
            <div>
            <img src="image/apple.png" type="image/png" height="150px" width="100px">
            <h2>Apple</h2>
            <b>20% Offer</b>
            <p>Weight: 1kg</p>
            <div>
            <button>200 rs</button>
            <p>Today only</p>
            <button>Add to Card</button>
            </div>
            </div>


        </section>
    </main>
    
</body>
</html>
