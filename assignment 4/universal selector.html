<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector</title>
    <style>

        * {
            color: blue;
            text-shadow: 2px 3px 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Universal Selector</h1>
    </header>
    <main>
        <h2>What is a Universal Selector in CSS?</h2>
        <p>    The Universal Selector (*) is used to select all HTML elements on a webpage and apply the same CSS styles to them.</p>
    </main>
    
</body>
</html>
