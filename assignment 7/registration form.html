<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <h1 class="text-capitalize text-center text-danger mt-3">student registration form</h1>
    <div class=" container border border-success rounded-3 w-50 mt-5">
    <form class="m-5 p-5">
        <label class="form-label">Name</label>
        <input type="text" placeholder="Enter your name" class="form-control">
        <label class="form-label">Email</label>
        <input type="email" placeholder="Enter your email" class="form-control">
        <label class="form-label">Phone</label>
        <input type="tel" placeholder="Enter your number" class="form-control">
        <button type="submit" class="btn btn-info mt-4">sumbit</button>

        
    </form>
    </div>
    
</body>
</html>
