<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="Card  border border-3 border-info m-5 rounded-4" style="width: 300px;">
       
        <img src="Image/tshirt.png" alt="t-shirt" class="card-img-top mt-1 w-75 p-2 ms-5">
         <div class="card-body">
            <h3 class="card-title text-center text-danger">Tommy Hilfiger</h3>
            <div class="text-center mt-3">
            
            <button class="btn btn-warning"><h5>Rs 500</h5></button>
            </div>
            <details class="h6 card-subtitle text-center text-drak p-3">
                <summary>More details</summary>
                <p>Tommy Hilfiger t-shirts typically feature pure cotton or cotton jersey fabric, a crew neck or polo style, and signature branding details.</p></details>
        </div>
    </div>
    
</body>
</html>
