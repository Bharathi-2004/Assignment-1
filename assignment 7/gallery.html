<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>




<!-- Image Gallery --><section class="container py-5" id="photos"><h2 class="text-center fw-bold mb-4">Our Photos</h2>

<div class="row g-4">

    <!-- Image 1 -->
    <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 class="card-img-top"
                 alt="Beautiful nature">
            <div class="card-body">
                <h5 class="card-title">Beautiful Nature</h5>
                <p class="card-text">Enjoy the beauty of nature.</p>
            </div>
        </div>
    </div>

    <!-- Image 2 -->
    <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 class="card-img-top"
                 alt="Mountain landscape">
            <div class="card-body">
                <h5 class="card-title">Mountain View</h5>
                <p class="card-text">Explore amazing mountain views.</p>
            </div>
        </div>
    </div>

    <!-- Image 3 -->
    <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
                 class="card-img-top"
                 alt="Sunrise landscape">
            <div class="card-body">
                <h5 class="card-title">Golden Sunrise</h5>
                <p class="card-text">Experience the morning sunshine.</p>
            </div>
        </div>
    </div>

    <!-- Image 4 -->
    <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 class="card-img-top"
                 alt="Green forest">
            <div class="card-body">
                <h5 class="card-title">Green Forest</h5>
                <p class="card-text">Discover the peaceful forest.</p>
            </div>
        </div>
    </div>

</div>

</section>

</section>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
