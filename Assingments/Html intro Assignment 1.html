<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>htmlintro</title>
    <link rel="icon" href="img/icon.png" type="png">
    
</head>
<body style="background-color: aqua;">
    <!-- examples of block element -->
    <div style="background-color: greenyellow;">
    <h1 style="color: rgb(87, 17, 216);">Parthiban</h1>
    <h2>Parthiban</h2>
    <h3>Parthiban</h3>
    </div>
    <div style="background-color: blueviolet;">
    <h4>Parthiban</h4>
    <h5>Parthiban</h5>
    <h6>Parthiban</h6>
    <p>Hello, everyone. I am Parthiban M</p>
    </div>
    <!-- examples of inline elemaent -->
    <u>html</u> <!-- Underline tag -->
    <s>html</s> <!-- Strikethrough  -->
    <strong>html</strong> 
    <b>html</b> <!-- bold -->
    <i>html</i> <!-- italic -->
    <em>html</em>
    <abbr title="hyper text markup language.">html</abbr> <!-- abbreviation  -->
    <q>htrml</q>    <!-- quotation -->
    <br>
    <span style="color: brown;">h</span>2<span></span>
    <span><var>x2</var> <small>text</small></span>
    <br> <span><var>x</var><sup>2</sup><var>+y</var><sup>2</sup></span>
    <p><b>Oxygen</b> = O<sub>2</sub></p>
    <p><b>Carbon Dioxide</b> = CO<sub>2</sub></p>
    <p><b><var>(x+y)<sup>2</sup></b></var>=<var>x<sup>2</sup></var>+<var>y<sup>2</sup></var>+<var>2xy</var></p>
</body>
</html>
