<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <table>
        <tr>
            <th colspan="2"> Student Registration Form </th>
        </tr>
        <tr>
           <td>
            <label for="name">Name</label>
           </td>
           <td>
            <input id="name" type="text" placeholder="Enter your name">
           </td>
        </tr>
        <tr>     
            <td>
            <label for="email">Email</label>
           </td>
           <td>
            <input id="email" type="email" placeholder="Enter your email">
           </td>
         </tr>
         <tr>     
            <td>
            <label for="password">Password</label>
           </td>
           <td>
            <input id="password" type="password" placeholder="abcd@0001" minlength="8" >
           </td>
         </tr>
         <tr>     
            <td>
            <label for="dob">Date of Birth</label>
           </td>
           <td>
            <input id="dob" type="date" value="2026-10-06" style="width: 96%;">
           </td>
         </tr>
         <tr>
            <td>
                <label>Gender</label>
            </td>
            <td>
                <input type="radio" name="Gender" value="Male">Male
                <input type="radio" name="Gender" value="Female">Female
                <input type="radio" name="Gender" value="other">Other
            </td>
         </tr>
         <tr>
            <td>
                <label>Department</label>
            </td>
            <td>
                <select name="Department">

                    <optgroup label="B.A">
                        <option>--Select department--</option>
                        <option value="Tamil">Tamil</option>
                        <option value="English">English</option>
                        <option value="History">History</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BBA">BBA</option>
                    </optgroup>
                    <optgroup label="B.Sc">
                        <option value="Computer Science">Computer Science</option>
                        <option value="Computer Application">Computer Application</option>
                        <option value="Maths">Maths</option>
                        <option value="Physics">Physics</option>
                        <option value="Botany">Botany</option>

                    </optgroup>
                </select>
            </td>
         </tr>
          <tr>
           <td>
            <label for="phone">Phone Number</label>
           </td>
           <td>
            <input id="phone" type="tel" placeholder="Enter your number" maxlength="10">
           </td>
        </tr>
        <tr>
           <td>
            <label for="Address">Address</label>
           </td>
           <td>
            <textarea placeholder="enter your address"></textarea>
           </td>
        </tr>
         <tr>
    <td>
        <input type="reset" value="Reset">
    </td>

    <td>
        <input type="submit" value="Submit">
    </td>
</tr>
    </table>
    
</body>
</html>
