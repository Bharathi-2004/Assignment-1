<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Form</title>
</head>
<body>
    <h2>Online Course Registration Form</h2>

    <table>
        
        <tr>
           <td>
            <label for="name">Name</label>
           </td>
           <td>
            <input id="name" type="text" placeholder="Enter your name">
           </td>
        </tr>
        <tr>     
            <td>
            <label for="email">Email</label>
           </td>
           <td>
            <input id="email" type="email" placeholder="Enter your email">
           </td>
         </tr>
         <tr>
            <td>
                <label>Qualification</label>
            </td>
            <td>
                <select name="Qualification" style="width: 100%;">

                    <optgroup label="B.A">
                        <option>--Select qualification--</option>
                        <option value="Tamil">Tamil</option>
                        <option value="English">English</option>
                        <option value="History">History</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BBA">BBA</option>
                    </optgroup>
                    <optgroup label="B.Sc">
                        <option value="Computer Science">Computer Science</option>
                        <option value="Computer Application">Computer Application</option>
                        <option value="Maths">Maths</option>
                        <option value="Physics">Physics</option>
                        <option value="Botany">Botany</option>

                    </optgroup>
                </select>
            </td>
         </tr>
         <tr>
            <td>
                <label>Course</label>
            </td>
            <td>
                <select name="Course" style="width: 100%;">
                    <option>--Select course--</option>
                    <option value="Fullstack">Fullstack</option>
                    <option value="Data Analyst">Data Analyst</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                    <option value="Networking">Networking</option>
                </select>
            </td>
         </tr>
         <tr>
            <td>
                <label>Mode of Education</label>
            </td>
            <td>
                <input type="radio" name="Education" value="Online">Online
                <input type="radio" name="Education" value="Offline">Offline
         </tr>
        
         <tr>
    

    <td>
        <input type="submit" value="Submit">
    </td>
</tr>
    </table>
    
</body>
</html>
